# npm version-update PRs are off (limit 0): dependency bumps come from upstream Quartz merges.
# Security-update PRs still open; they ignore this limit.
# github-actions stays on: deploy.yml is ours, and upstream merges will not update it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      # Separated so a risky third-party major cannot block ecosystem updates.
      quartz-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
      # Isolated because a compiler major needs a tsconfig migration of its own.
      typescript:
        applies-to: "version-updates"
        patterns:
          - "typescript"
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
          - "typescript"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
