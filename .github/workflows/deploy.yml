name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz Plugins
        run: npx quartz plugin install
      # The local plugins in plugins/ (footer, section-nav, og-image) aren't in
      # quartz.lock.json, so the step above skips them. This links them and
      # rebuilds .quartz/plugins/index.ts, which core Quartz imports og-image
      # from. Pinned plugins are already installed, so their versions don't move.
      - name: Link Local Quartz Plugins
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        run: npx quartz build
      - name: Add .nojekyll file
        run: touch public/.nojekyll
      - name: Add CNAME file
        run: echo "moesfrontmatters.com" > public/CNAME
      - name: Add robots.txt to site root
        run: cp quartz/static/robots.txt public/robots.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
