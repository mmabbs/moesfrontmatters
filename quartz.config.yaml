# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Moe's Frontmatters"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-XPWM630G25
  locale: en-US
  baseUrl: moesfrontmatters.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "**/*private*.md"
    - "**/*templates*.md"
    - "**/*.obsidian*.md"
    - "**/*draft*.md"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header:
        name: Zilla Slab
        weights: [500, 600]
      # Satoshi is on Fontshare, not Google Fonts. Google skips it and still
      # serves the other families; custom.scss loads Satoshi with @font-face.
      body:
        name: Satoshi
        weights: [400, 500, 700]
        includeItalic: false
      code:
        name: JetBrains Mono
        weights: [400, 500, 700]
    colors:
      lightMode:
        light: "#F1EADF"
        lightgray: "#E8E1D6"
        gray: "#DAD3C8"
        darkgray: "#5E5A55"
        dark: "#24211D"
        secondary: "#24211D"
        tertiary: "#76531B"
        highlight: "#E8E1D6"
        textHighlight: "#76531B33"
      darkMode:
        light: "#24211D"
        lightgray: "#2A2622"
        gray: "#383430"
        darkgray: "#B0AAA1"
        dark: "#F1EADF"
        secondary: "#F1EADF"
        tertiary: "#C9913B"
        highlight: "#302D28"
        textHighlight: "#C9913B4D"
plugins:
  # --- Transformers ---
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      hidePropertiesView: true
    order: 5
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80

  # --- Filters ---
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
    order: 45

  # --- Emitters ---
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  # Local fork of og-image 1.0.0: fetches Satoshi from Fontshare for link
  # preview images (Google Fonts doesn't host it). No font file is stored
  # in the repo; see plugins/og-image/src/emitter.tsx fetchFontshareTtf.
  # Rebuild after editing src/: cd plugins/og-image && npm run build
  - source: ./plugins/og-image
    enabled: true
    options:
      fontshare: [Satoshi]
  - source: github:quartz-community/cname
    enabled: true

  # --- Page Types ---
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true

  # --- Layout Components ---
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # Off: on phones the section nav fills the row and pushes the theme toggle right.
  - source: github:quartz-community/spacer
    enabled: false
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # Local plugin: section list in the left sidebar on every screen size
  # (the footer has no section nav, so phones need this one).
  # Project pages mark their `section:` frontmatter. Rebuild after editing src/:
  # cd plugins/section-nav && npm run build
  - source: ./plugins/section-nav
    enabled: true
    layout:
      position: left
      priority: 20
    options:
      links:
        Home: /
        AI: /ai
        Games: /games
        # Film & TV: /film-tv  (restore when content/film-tv.md drops draft: true)
        Marketing: /marketing
        Digital Garden: /digital-garden
        About: /about-me
  # Local fork: profile links, contact email, and copyright with the Quartz
  # credit. Its `nav` option is unused; section-nav carries the sections.
  # Rebuild after editing src/: cd plugins/footer && npm run build
  - source: ./plugins/footer
    enabled: true
    options:
      owner: Moe Abbas
      contact: moe[at]moesfrontmatters.com
      links:
        GitHub: https://github.com/mmabbs/
        LinkedIn: https://www.linkedin.com/in/moe-m-abbas/

  # --- Disabled (available but not active) ---
  - source: github:quartz-community/search
    enabled: false
  - source: github:quartz-community/explorer
    enabled: false
  - source: github:quartz-community/page-title
    enabled: false
  - source: github:quartz-community/graph
    enabled: false
  - source: github:quartz-community/reader-mode
    enabled: false
  - source: github:quartz-community/stacked-pages
    enabled: false
  - source: github:quartz-community/comments
    enabled: false
  - source: github:quartz-community/tag-list
    enabled: false
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/encrypted-pages
    enabled: true
  - source: github:quartz-community/bases-page
    enabled: true

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    # Default frame puts the 404 in the page grid like every other page
    # (the page type ships with the edge-to-edge "minimal" frame). The left
    # sidebar carries the theme toggle and the section nav.
    "404":
      template: default
      positions:
        beforeBody: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
    canvas: {}
